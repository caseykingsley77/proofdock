name: Tests
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  python:
    name: Python ${{ matrix.python-version }} tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - name: Install dependencies
        run: python -m pip install -e './services/api[dev]' pytest-cov
      - name: Run tests with coverage
        run: python -m pytest -q services/api/tests --cov=app --cov-report=term-missing

  rust:
    name: Rust unit tests and formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.89.0'
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Test workspace
        run: cargo test --workspace
